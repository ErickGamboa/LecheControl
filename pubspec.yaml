name: leche_control
description: "LecheControl — app offline-first para lechería."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.14.0
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  uuid: ^4.5.3
  connectivity_plus: ^7.1.1
  path_provider: ^2.1.6
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.33.0
  build_runner: ^2.15.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo_lechecontrol.png
    - assets/icono_parto.png
